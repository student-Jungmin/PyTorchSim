name: Triton codegen route (pytorchsim-triton-opt)

# Exercises the Triton codegen route: Inductor's own Triton backend produces the
# kernel and pytorchsim-triton-opt lowers it to a RISC-V ELF.
# (PyTorchSimFrontend/triton_backend/README.md)
#
# Separate from the main CI on purpose. The route is WIP, and its toolchain layer
# is ~1.8 GiB that no other job needs, so it neither gates PRs nor slows them
# down. Promote the jobs into pytorchsim_test.yml once the route runs end to end.
#
# The secret keeps its old name on purpose: GitHub cannot rename a secret, and
# an existing one's value is not readable, so re-creating it would mean issuing a
# new PAT to buy nothing a person ever sees. Everything downstream is PSTO_.
# Needs secrets.TNPU_TOKEN: a PAT that can read PSAL-POSTECH/pytorchsim-triton-opt and its
# toolchain-llvm23 release. The repo is private and the default Actions token is
# scoped to this repository. preflight checks it before the docker build.

on:
  pull_request:
    branches: [ "master", "develop" ]
    paths:
      - 'PyTorchSimFrontend/triton_backend/**'
      - 'PyTorchSimFrontend/tog/**'
      - 'thirdparty/pytorchsim-triton-opt.json'
      - 'Dockerfile.psto'
      - 'scripts/ci/psto_base_pin.sh'
      - 'scripts/ci/triton_route_passing.txt'
      - '.github/workflows/triton_npu.yml'
  workflow_dispatch:

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PSTO_IMAGE_REPO: ghcr.io/psal-postech/torchsim_psto_base
  APP_IMAGE_REPO: ghcr.io/psal-postech/torchsim_psto
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Check psto access
    runs-on: [self-hosted, slurm, x86_64]
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Token and release present
        id: check
        env:
          PSTO_TOKEN: ${{ secrets.TNPU_TOKEN }}
        run: |
          if [ -z "${PSTO_TOKEN}" ]; then
            echo "::error::secrets.TNPU_TOKEN is not set. PSAL-POSTECH/pytorchsim-triton-opt is private and the default Actions token cannot read it."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          REPO=$(jq -r '.pytorchsim_triton_opt.repository' thirdparty/pytorchsim-triton-opt.json)
          TAG=$(jq -r '.pytorchsim_triton_opt.release_tag' thirdparty/pytorchsim-triton-opt.json)
          if ! curl -fsS -H "Authorization: Bearer ${PSTO_TOKEN}" \
               "https://api.github.com/repos/${REPO}" -o /dev/null; then
            echo "::error::PSTO_TOKEN cannot read ${REPO}."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if ! curl -fsS -H "Authorization: Bearer ${PSTO_TOKEN}" \
               "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" -o /dev/null; then
            echo "::error::${REPO} has no release tagged '${TAG}'. Mirror the toolchain assets there (see thirdparty/pytorchsim-triton-opt.json)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  ensure-psto-base:
    name: Build psto toolchain image
    needs: preflight
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      psto_image: ${{ steps.pin.outputs.psto_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pins
        id: pin
        run: |
          BASE_PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          PSTO_PIN="$(bash scripts/ci/psto_base_pin.sh)"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:thirdparty-${BASE_PIN}" >> "$GITHUB_ENV"
          # The psto layer sits on a specific base, so its tag carries both pins.
          echo "PSTO_IMAGE=${PSTO_IMAGE_REPO}:psto-${PSTO_PIN}-base-${BASE_PIN}" >> "$GITHUB_ENV"
          echo "psto_image=${PSTO_IMAGE_REPO}:psto-${PSTO_PIN}-base-${BASE_PIN}" >> "$GITHUB_OUTPUT"
          echo "PSTO_REF=$(jq -r '.pytorchsim_triton_opt.ref' thirdparty/pytorchsim-triton-opt.json)" >> "$GITHUB_ENV"

      - name: Check psto image exists
        id: exists
        run: |
          if docker manifest inspect "${PSTO_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push psto toolchain image
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.psto
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PSTO_REF=${{ env.PSTO_REF }}
          secrets: |
            psto_token=${{ secrets.TNPU_TOKEN }}
          tags: ${{ env.PSTO_IMAGE }}

  build-app:
    name: Build app image on psto base
    needs: ensure-psto-base
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      app_image: ${{ steps.name.outputs.app_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "app_image=${APP_IMAGE_REPO}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.ensure-psto-base.outputs.psto_image }}
          tags: ${{ steps.name.outputs.app_image }}

  psto-baselines:
    name: pytorchsim-triton-opt baselines
    needs: build-app
    runs-on: [self-hosted, slurm, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The harness's own kernels, end to end through Spike. This is the gate on
      # the toolchain itself: if these regress, nothing downstream is meaningful.
      # gemm/bmm need PSTO_VCIX_MATMUL=1 to reach the systolic array.
      - name: doctor + add / mul / relu / gemm / bmm
        run: |
          docker run --rm -e PSTO_VCIX_MATMUL=1 \
            ${{ needs.build-app.outputs.app_image }} bash -lc '
              cd /workspace/pytorchsim-triton-opt &&
              python3 pytorchsim-triton-opt doctor &&
              for k in add mul relu gemm bmm; do
                echo "=== $k ===" && python3 pytorchsim-triton-opt tests/cases/smoke/$k.py || exit 1
              done'

  triton-route:
    name: Inductor Triton route
    needs: build-app
    runs-on: [self-hosted, slurm, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: test_triton_codegen.py
        run: |
          docker run --rm \
            ${{ needs.build-app.outputs.app_image }} \
            python3 PyTorchSim/tests/system/test_triton_codegen.py

  coverage-sweep:
    name: Coverage sweep beyond the allowlist
    needs: build-app
    runs-on: [self-hosted, slurm, big, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reports every test, allowlist included. Each failure leaves its kernel
      # and stage IR behind. pytorchsim_test.yml is what gates the allowlist.
      - name: Full sweep (report)
        continue-on-error: true
        run: |
          mkdir -p sweep && chmod 777 sweep
          docker run --rm -v "$PWD/sweep:/sweep" \
            ${{ needs.build-app.outputs.app_image }} \
            python3 PyTorchSim/scripts/ci/triton_route_sweep.py --all \
              --timeout 900 --json /sweep/results.json \
              --markdown /sweep/coverage.md --artifacts /sweep/failures
          cat sweep/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triton-route-coverage
          path: sweep/
          if-no-files-found: warn
